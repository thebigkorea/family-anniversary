<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>가족·지인 기념일 관리</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  padding:18px;
  background:#f3f5f9;
  font-family:'Malgun Gothic',sans-serif;
  color:#222;
}

.app-wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
}

.hero-banner{
  width:100%;
  height:170px;
  border-radius:26px;
  overflow:hidden;
  margin-bottom:20px;
  background:#e9edf5;
  box-shadow:0 5px 22px rgba(0,0,0,0.10);
}

.hero-banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

h1{
  margin:0 0 18px;
  font-size:28px;
  letter-spacing:-1px;
}

h2{
  margin-top:0;
  font-size:22px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
}

.badges{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.badge{
  flex:1;
  border-radius:18px;
  padding:14px 8px;
  text-align:center;
  font-weight:bold;
  font-size:16px;
  line-height:1.5;
}

.today{ background:#fff1f1; color:#ff3b30; }
.tomorrow{ background:#fff4ea; color:#ff7a00; }
.week{ background:#edf4ff; color:#1d74ff; }

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:18px;
}

.tab{
  background:#e9edf5;
  color:#333;
  border:none;
  border-radius:16px;
  padding:14px 6px;
  font-size:14px;
  font-weight:bold;
  word-break:keep-all;
}

.tab.active{
  background:#2563ff;
  color:#fff;
}

.section{ display:none; }
.section.active{ display:block; }

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin:10px 0 6px;
}

input,select,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  background:#fff;
}

textarea{
  height:80px;
  resize:none;
}

.row{
  display:flex;
  gap:10px;
}

.col{ flex:1; }

button{
  width:100%;
  border:none;
  border-radius:15px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{ transform:scale(0.98); }

.primary{
  background:#2563ff;
  color:#fff;
  margin-top:14px;
}

.green{ background:#22c55e; color:#fff; }
.purple{ background:#8b5cf6; color:#fff; }
.gray{ background:#64748b; color:#fff; }

.event{
  border-bottom:1px solid #eee;
  padding:16px 0;
}

.event:last-child{ border-bottom:none; }

.event-title{
  font-size:18px;
  font-weight:bold;
}

.event-date{
  margin-top:5px;
  color:#666;
  font-size:14px;
}

.event-message{
  margin-top:10px;
  background:#f6f7fb;
  border-radius:14px;
  padding:13px;
  line-height:1.6;
  font-size:15px;
}

.event-buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.event-buttons button{
  padding:12px;
  font-size:14px;
}

.help{
  font-size:13px;
  color:#666;
  line-height:1.5;
  margin-top:8px;
}

.repeat-badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  background:#eef1f5;
  color:#555;
}

.empty-box{
  color:#333;
  line-height:1.6;
}

.month-control{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}

.month-control button{
  width:52px;
  padding:12px 0;
  background:#e9edf5;
  color:#333;
}

.month-title{
  flex:1;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.month-title select{
  width:auto;
  min-width:92px;
  display:inline-block;
  padding:10px 12px;
  border-radius:14px;
  border:1px solid #d7dce5;
  background:#fff;
  font-size:16px;
  font-weight:bold;
  margin:0 3px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day-name{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  color:#666;
  padding:8px 0;
}

.day-cell{
  min-height:84px;
  background:#f8fafc;
  border-radius:14px;
  padding:7px;
  font-size:13px;
  cursor:pointer;
  border:1px solid #eef1f5;
}

.day-cell.empty{
  background:transparent;
  border:none;
  cursor:default;
}

.day-num{
  font-weight:bold;
  margin-bottom:5px;
}

.cal-event{
  display:block;
  margin-top:4px;
  padding:4px 5px;
  border-radius:8px;
  background:#edf4ff;
  color:#1d4ed8;
  font-size:11px;
  line-height:1.3;
}

.cal-event.appointment{
  background:#f3e8ff;
  color:#7e22ce;
}

.type-badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  background:#edf4ff;
  color:#1d4ed8;
  margin-top:8px;
}

.type-badge.appointment{
  background:#f3e8ff;
  color:#7e22ce;
}

.lunar-text{
  display:block;
  margin-top:2px;
  color:#666;
  font-size:10px;
  line-height:1.3;
}

.person-box{
  border:1px solid #edf0f5;
  border-radius:16px;
  padding:14px;
  margin-top:14px;
  background:#fafbff;
}

.person-name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.info-line{
  font-size:14px;
  line-height:1.7;
}

.small-title{
  margin-top:12px;
  font-weight:bold;
  font-size:15px;
}

@media(max-width:600px){
  body{ padding:14px; }
  .hero-banner{ height:145px; border-radius:22px; }
  h1{ font-size:25px; }
  .card{ padding:18px; }
  .tab{ font-size:13px; padding:13px 4px; }
  .day-cell{ min-height:76px; padding:6px; }
  .cal-event{ font-size:10px; }
}
</style>
</head>

<body>

<div class="app-wrap">

  <div class="hero-banner">
    <img src="images/family-banner.png" alt="가족 기념일 관리 이미지">
  </div>

  <h1>가족·지인 기념일 관리</h1>

  <div class="badges">
    <div class="badge today" id="todayBadge">오늘<br>0건</div>
    <div class="badge tomorrow" id="tomorrowBadge">내일<br>0건</div>
    <div class="badge week" id="weekBadge">7일 이내<br>0건</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showSection('home', this)">기념일</button>
    <button class="tab" onclick="showSection('calendarSec', this)">월간달력</button>
    <button class="tab" onclick="showSection('searchSec', this)">사람조회</button>
    <button class="tab" onclick="showSection('person', this)">사람등록</button>
    <button class="tab" onclick="showSection('anniv', this)">기념일추가</button>
    <button class="tab" onclick="showSection('appointmentSec', this)">약속추가</button>
  </div>

  <div id="home" class="section active">
    <div class="card">
      <h2>다가오는 기념일</h2>
      <div id="eventList" class="empty-box">불러오는 중...</div>
    </div>
  </div>

  <div id="calendarSec" class="section">
    <div class="card">
      <h2>월간 캘린더</h2>

      <div class="month-control">
        <button onclick="moveMonth(-1)">◀</button>

        <div class="month-title">
          <select id="calendarYear" onchange="selectMonthCalendar()"></select>
          <select id="calendarMonth" onchange="selectMonthCalendar()"></select>
        </div>

        <button onclick="moveMonth(1)">▶</button>
      </div>

      <div class="calendar" id="calendarGrid"></div>

      <div class="help">
        음력 기념일은 올해 기준 양력 날짜로 변환되어 표시됩니다.
      </div>
    </div>

    <div class="card">
      <h2>선택한 날짜</h2>
      <div id="selectedDayList" class="empty-box">날짜를 선택하세요.</div>
    </div>
  </div>

  <div id="searchSec" class="section">
    <div class="card">
      <h2>사람 조회</h2>

      <label>이름 / 관계 / 전화번호 검색</label>
      <input type="text" id="searchKeyword" placeholder="예: 어머니, 홍길동, 친구">
      <button class="primary" onclick="searchPerson()">검색</button>

      <div id="personSearchResult" class="empty-box" style="margin-top:14px;">
        이름을 검색하면 등록된 기본정보가 표시됩니다.
      </div>
    </div>
  </div>

  <div id="person" class="section">
    <div class="card">
      <h2>사람 등록</h2>

      <label>이름</label>
      <input type="text" id="personName">

      <label>관계</label>
      <input type="text" id="personRelation" placeholder="어머니 / 친구 / 친척 / 거래처 등">

      <label>휴대폰번호</label>
      <input type="tel" id="personPhone">

      <label>주소</label>
      <input type="text" id="personAddress">

      <label>메모</label>
      <textarea id="personMemo"></textarea>

      <label>선물 취향</label>
      <input type="text" id="personGift">

      <label>주의사항</label>
      <input type="text" id="personWarning">

      <button class="primary" onclick="savePerson()">사람 저장</button>

      <div class="help">
        사람은 한 번만 등록하고, 생일·시험일·결혼기념일 등은 기념일추가에서 여러 개 등록합니다.
      </div>
    </div>
  </div>

  <div id="anniv" class="section">
    <div class="card">
      <h2>기념일 추가</h2>

      <label>사람 검색 / 선택</label>
      <input
        type="text"
        id="personSearch"
        list="peopleList"
        placeholder="이름 또는 관계 입력"
        oninput="selectPersonByInput()"
      >

      <datalist id="peopleList"></datalist>
      <input type="hidden" id="annivPerson">

      <div class="help">
        예: 어머니, 친구, 이름 일부를 입력해서 선택하세요.
      </div>

      <label>행사구분</label>
      <input type="text" id="eventType" placeholder="생일 / 시험 / 결혼기념일 / 제사 등">

      <label>행사명</label>
      <input type="text" id="eventName" placeholder="예: 어머니 생신, 손주 생일">

      <label>양음력</label>
      <select id="calendarType">
        <option value="양력">양력</option>
        <option value="음력">음력</option>
      </select>

      <div class="row">
        <div class="col">
          <label>월</label>
          <input type="number" id="eventMonth" placeholder="월">
        </div>
        <div class="col">
          <label>일</label>
          <input type="number" id="eventDay" placeholder="일">
        </div>
      </div>

      <label>윤달 여부</label>
      <select id="leapMonth">
        <option value="N">윤달 아님</option>
        <option value="Y">윤달</option>
      </select>

      <label>알림일수</label>
      <input type="number" id="alertDays" value="7">

      <label>반복구분</label>
      <select id="repeatType">
        <option value="매년">매년 반복</option>
        <option value="한번">한 번만</option>
      </select>

      <label>메모</label>
      <textarea id="annivMemo"></textarea>

      <button class="primary" onclick="saveAnniversary()">기념일 저장</button>
    </div>
  </div>

  <div id="appointmentSec" class="section">
    <div class="card">
      <h2>약속 추가</h2>

      <label>약속명</label>
      <input type="text" id="appointmentTitle" placeholder="예: 점심약속 / 병원예약 / 거래처 미팅">

      <label>상대방 이름</label>
      <input type="text" id="appointmentPerson" placeholder="사람등록 없이 직접 입력 가능">

      <label>날짜</label>
      <input type="date" id="appointmentDate">

      <label>시간</label>
      <input type="time" id="appointmentTime">

      <label>장소</label>
      <input type="text" id="appointmentLocation" placeholder="예: 잠실 / 사무실 / 병원">

      <label>메모</label>
      <textarea id="appointmentMemo"></textarea>

      <label>알림일수</label>
      <input type="number" id="appointmentAlertDays" value="7">

      <button class="primary" onclick="saveAppointment()">약속 저장</button>

      <div class="help">
        사람등록이 되어 있지 않아도 약속을 바로 입력할 수 있습니다.
      </div>
    </div>
  </div>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwLF5bl4M9Gwdcfc7ys63tj9_WG5VczrVHu4Ztfjo4Vf5dda-NK7FctQ3P0qTY2X_Q8/exec";

let peopleCache = [];
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let currentMonthEvents = [];

function initCalendarSelect(){
  const yearSelect = document.getElementById("calendarYear");
  const monthSelect = document.getElementById("calendarMonth");

  if(!yearSelect || !monthSelect) return;

  yearSelect.innerHTML = "";
  monthSelect.innerHTML = "";

  for(let y = 2020; y <= 2060; y++){
    const option = document.createElement("option");
    option.value = y;
    option.textContent = y + "년";
    if(y === currentYear) option.selected = true;
    yearSelect.appendChild(option);
  }

  for(let m = 1; m <= 12; m++){
    const option = document.createElement("option");
    option.value = m;
    option.textContent = m + "월";
    if(m === currentMonth) option.selected = true;
    monthSelect.appendChild(option);
  }
}

function syncCalendarSelect(){
  const yearSelect = document.getElementById("calendarYear");
  const monthSelect = document.getElementById("calendarMonth");

  if(!yearSelect || !monthSelect) return;

  yearSelect.value = currentYear;
  monthSelect.value = currentMonth;
}

function selectMonthCalendar(){
  currentYear = Number(document.getElementById("calendarYear").value);
  currentMonth = Number(document.getElementById("calendarMonth").value);
  loadMonthlyCalendar();
}

function showSection(id, btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  btn.classList.add("active");

  if(id === "anniv") loadPeople();
  if(id === "home") loadEvents();
  if(id === "calendarSec") loadMonthlyCalendar();
  if(id === "appointmentSec") setDefaultAppointmentDate();
}

async function savePerson(){
  const params = new URLSearchParams();

  params.append("action","savePerson");
  params.append("name", document.getElementById("personName").value);
  params.append("relation", document.getElementById("personRelation").value);
  params.append("phone", document.getElementById("personPhone").value);
  params.append("address", document.getElementById("personAddress").value);
  params.append("memo", document.getElementById("personMemo").value);
  params.append("gift", document.getElementById("personGift").value);
  params.append("warning", document.getElementById("personWarning").value);

  const res = await fetch(API_URL + "?" + params.toString());
  const data = await res.json();

  alert(data.message);

  document.getElementById("personName").value = "";
  document.getElementById("personRelation").value = "";
  document.getElementById("personPhone").value = "";
  document.getElementById("personAddress").value = "";
  document.getElementById("personMemo").value = "";
  document.getElementById("personGift").value = "";
  document.getElementById("personWarning").value = "";

  loadPeople();
}

async function loadPeople(){
  const res = await fetch(API_URL + "?action=getPeople");
  const data = await res.json();

  peopleCache = data.people || [];

  const list = document.getElementById("peopleList");
  list.innerHTML = "";

  peopleCache.forEach(p=>{
    const option = document.createElement("option");
    option.value = `${p.name} (${p.relation})`;
    list.appendChild(option);
  });
}

function selectPersonByInput(){
  const inputValue = document.getElementById("personSearch").value.trim();
  const hidden = document.getElementById("annivPerson");

  const found = peopleCache.find(p =>
    `${p.name} (${p.relation})` === inputValue ||
    p.name === inputValue
  );

  hidden.value = found ? found.id : "";
}

async function saveAnniversary(){
  selectPersonByInput();

  const personId = document.getElementById("annivPerson").value;

  if(!personId){
    alert("등록된 사람을 정확히 선택하거나 입력하세요.");
    return;
  }

  const params = new URLSearchParams();

  params.append("action","saveAnniversary");
  params.append("personId", personId);
  params.append("eventType", document.getElementById("eventType").value);
  params.append("eventName", document.getElementById("eventName").value);
  params.append("calendarType", document.getElementById("calendarType").value);
  params.append("month", document.getElementById("eventMonth").value);
  params.append("day", document.getElementById("eventDay").value);
  params.append("leapMonth", document.getElementById("leapMonth").value);
  params.append("alertDays", document.getElementById("alertDays").value);
  params.append("repeatType", document.getElementById("repeatType").value);
  params.append("memo", document.getElementById("annivMemo").value);

  const res = await fetch(API_URL + "?" + params.toString());
  const data = await res.json();

  alert(data.message);

  document.getElementById("personSearch").value = "";
  document.getElementById("annivPerson").value = "";
  document.getElementById("eventType").value = "";
  document.getElementById("eventName").value = "";
  document.getElementById("eventMonth").value = "";
  document.getElementById("eventDay").value = "";
  document.getElementById("annivMemo").value = "";
  document.getElementById("alertDays").value = "7";
  document.getElementById("calendarType").value = "양력";
  document.getElementById("leapMonth").value = "N";
  document.getElementById("repeatType").value = "매년";

  loadEvents();
  loadMonthlyCalendar();
}


function setDefaultAppointmentDate(){
  const dateInput = document.getElementById("appointmentDate");
  if(dateInput && !dateInput.value){
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    dateInput.value = `${yyyy}-${mm}-${dd}`;
  }
}

async function saveAppointment(){
  const title = document.getElementById("appointmentTitle").value.trim();
  const personName = document.getElementById("appointmentPerson").value.trim();
  const date = document.getElementById("appointmentDate").value;

  if(!title){
    alert("약속명을 입력하세요.");
    return;
  }

  if(!date){
    alert("약속 날짜를 선택하세요.");
    return;
  }

  const params = new URLSearchParams();

  params.append("action","saveAppointment");
  params.append("title", title);
  params.append("personName", personName);
  params.append("date", date);
  params.append("time", document.getElementById("appointmentTime").value);
  params.append("location", document.getElementById("appointmentLocation").value);
  params.append("memo", document.getElementById("appointmentMemo").value);
  params.append("alertDays", document.getElementById("appointmentAlertDays").value);

  const res = await fetch(API_URL + "?" + params.toString());
  const data = await res.json();

  alert(data.message || "약속 저장 완료");

  document.getElementById("appointmentTitle").value = "";
  document.getElementById("appointmentPerson").value = "";
  document.getElementById("appointmentDate").value = "";
  document.getElementById("appointmentTime").value = "";
  document.getElementById("appointmentLocation").value = "";
  document.getElementById("appointmentMemo").value = "";
  document.getElementById("appointmentAlertDays").value = "7";

  setDefaultAppointmentDate();
  loadEvents();
  loadMonthlyCalendar();
}


async function loadEvents(){
  const res = await fetch(API_URL + "?action=getUpcomingEvents");
  const data = await res.json();

  const list = document.getElementById("eventList");

  let todayCount = 0;
  let tomorrowCount = 0;

  if(!data.events || data.events.length === 0){
    list.innerHTML = "예정된 기념일이 없습니다.";
    document.getElementById("todayBadge").innerHTML = `오늘<br>0건`;
    document.getElementById("tomorrowBadge").innerHTML = `내일<br>0건`;
    document.getElementById("weekBadge").innerHTML = `7일 이내<br>0건`;
    return;
  }

  let html = "";

  data.events.forEach(event=>{
    if(event.dday === 0) todayCount++;
    if(event.dday === 1) tomorrowCount++;

    html += `
      <div class="event">
        <div class="event-title">
          ${event.title || event.eventName || event.eventType} ${event.itemType === "appointment" ? "" : "- " + event.name}
        </div>

        <div class="event-date">
          ${event.displayDateText || event.date} / D-${event.dday} / ${event.itemType === "appointment" ? "약속" : event.calendarType}
        </div>

        ${event.itemType === "appointment" 
          ? `<span class="type-badge appointment">약속</span>` 
          : `<span class="repeat-badge">${event.repeatType === "한번" ? "한 번만" : "매년 반복"}</span>`}

        ${event.personName ? `<div class="help">상대방: ${event.personName}</div>` : ""}
        ${event.time ? `<div class="help">시간: ${event.time}</div>` : ""}
        ${event.location ? `<div class="help">장소: ${event.location}</div>` : ""}

        <div class="event-message">
          ${event.message}
        </div>

        ${event.gift ? `<div class="help">선물취향: ${event.gift}</div>` : ""}
        ${event.warning ? `<div class="help">주의사항: ${event.warning}</div>` : ""}

        <div class="event-buttons">
          <button class="green" onclick="callPhone('${event.phone || ""}')">전화</button>
          <button class="purple" onclick="copyMessage(\`${event.message || ""}\`)">문구복사</button>
        </div>
      </div>
    `;
  });

  list.innerHTML = html;

  document.getElementById("todayBadge").innerHTML = `오늘<br>${todayCount}건`;
  document.getElementById("tomorrowBadge").innerHTML = `내일<br>${tomorrowCount}건`;
  document.getElementById("weekBadge").innerHTML = `7일 이내<br>${data.count}건`;
}

async function loadMonthlyCalendar(){
  const grid = document.getElementById("calendarGrid");

  syncCalendarSelect();
  grid.innerHTML = "불러오는 중...";

  try{
    const res = await fetch(
      API_URL + `?action=getMonthlyEvents&year=${currentYear}&month=${currentMonth}`
    );
    const data = await res.json();
    currentMonthEvents = data.events || [];
  }catch(e){
    currentMonthEvents = [];
  }

  renderCalendar();
}

function renderCalendar(){
  const grid = document.getElementById("calendarGrid");
  const weekNames = ["일","월","화","수","목","금","토"];

  let html = "";

  weekNames.forEach(w=>{
    html += `<div class="day-name">${w}</div>`;
  });

  const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
  const lastDate = new Date(currentYear, currentMonth, 0).getDate();

  for(let i=0;i<firstDay;i++){
    html += `<div class="day-cell empty"></div>`;
  }

  for(let day=1; day<=lastDate; day++){
    const dayEvents = currentMonthEvents.filter(e => Number(e.day) === day);

    html += `
      <div class="day-cell" onclick="showDayEvents(${day})">
        <div class="day-num">${day}</div>
    `;

    dayEvents.slice(0,2).forEach(ev=>{
      html += `
        <div class="cal-event ${ev.itemType === "appointment" ? "appointment" : ""}">
          ${ev.title || ev.eventName || ev.eventType}
          <span class="lunar-text">${ev.displayDateText || ev.date}</span>
        </div>
      `;
    });

    if(dayEvents.length > 2){
      html += `<div class="lunar-text">+${dayEvents.length - 2}건</div>`;
    }

    html += `</div>`;
  }

  grid.innerHTML = html;
}

function showDayEvents(day){
  const list = currentMonthEvents.filter(e => Number(e.day) === day);
  const box = document.getElementById("selectedDayList");

  if(list.length === 0){
    box.innerHTML = "선택한 날짜의 기념일이 없습니다.";
    return;
  }

  let html = "";

  list.forEach(ev=>{
    html += `
      <div class="event">
        <div class="event-title">${ev.title || ev.eventName || ev.eventType}</div>
        <span class="type-badge ${ev.itemType === "appointment" ? "appointment" : ""}">
          ${ev.itemType === "appointment" ? "약속" : "기념일"}
        </span>
        <div class="event-date">
          ${ev.itemType === "appointment" 
            ? `${ev.personName || ""} ${ev.time ? "· " + ev.time : ""}` 
            : `${ev.name || ""} (${ev.relation || ""})`}
        </div>
        <div class="event-date">${ev.displayDateText || ev.date}</div>
        ${ev.location ? `<div class="event-date">장소: ${ev.location}</div>` : ""}
        <div class="event-message">${ev.message || ev.memo || ""}</div>
      </div>
    `;
  });

  box.innerHTML = html;
}

function moveMonth(diff){
  currentMonth += diff;

  if(currentMonth < 1){
    currentMonth = 12;
    currentYear--;
  }

  if(currentMonth > 12){
    currentMonth = 1;
    currentYear++;
  }

  loadMonthlyCalendar();
}

async function searchPerson(){
  const keyword = document.getElementById("searchKeyword").value.trim();

  if(!keyword){
    alert("검색어를 입력하세요.");
    return;
  }

  const res = await fetch(
    API_URL + `?action=searchPerson&keyword=${encodeURIComponent(keyword)}`
  );
  const data = await res.json();

  const box = document.getElementById("personSearchResult");

  if(!data.people || data.people.length === 0){
    box.innerHTML = "검색 결과가 없습니다.";
    return;
  }

  let html = "";

  data.people.forEach(person=>{
    html += `
      <div class="person-box">
        <div class="person-name">${person.name}</div>
        <div class="info-line">관계 : ${person.relation || "-"}</div>
        <div class="info-line">전화번호 : ${person.phone || "-"}</div>
        <div class="info-line">주소 : ${person.address || "-"}</div>
        <div class="info-line">메모 : ${person.memo || "-"}</div>
        <div class="info-line">선물취향 : ${person.gift || "-"}</div>
        <div class="info-line">주의사항 : ${person.warning || "-"}</div>
        <div class="small-title">등록된 기념일</div>
    `;

    if(!person.anniversaries || person.anniversaries.length === 0){
      html += `<div class="help">등록된 기념일이 없습니다.</div>`;
    } else {
      person.anniversaries.forEach(ev=>{
        html += `
          <div class="event">
            <div class="event-title">${ev.eventName || ev.eventType}</div>
            <div class="event-date">${ev.displayDate || "-"}</div>
          </div>
        `;
      });
    }

    html += `</div>`;
  });

  box.innerHTML = html;
}

function callPhone(phone){
  if(!phone){
    alert("전화번호가 없습니다.");
    return;
  }
  location.href = "tel:" + phone;
}

function copyMessage(msg){
  navigator.clipboard.writeText(msg);
  alert("문구 복사 완료");
}

initCalendarSelect();
loadPeople();
loadEvents();
loadMonthlyCalendar();
</script>

</body>
</html>
